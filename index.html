<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiro a Segno VR - Cabinato & Beretta</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffcc;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
  </style>

  <!-- Import Map per Three.js e moduli ufficiali -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui-container">PUNTI: <span id="score">0</span></div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    class ShootingGame {
      constructor() {
        this.score = 0;
        this.targets = [];
        this.berettaModel = null;
        this.rightGrip = null;
        this.rightController = null;

        this.initAudio();
        this.initScene();
        this.initXR();
        this.loadCabinato();
        this.initTargets();
        this.initEvents();

        this.renderer.setAnimationLoop(this.render.bind(this));
      }

      // --- SINTETIZZATORE AUDIO (Sparo + Impatto) ---
      initAudio() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playShootSound() {
        if (!this.audioCtx) return;
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.15);
      }

      playHitSound() {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.1);
      }

      // --- INIZIALIZZAZIONE SCENA THREE.JS ---
      initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x111118);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        this.camera.position.set(0, 1.2, 1.2);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.pixelRatio = window.devicePixelRatio;
        this.renderer.shadowMap.enabled = true;
        this.renderer.xr.enabled = true;
        document.body.appendChild(this.renderer.domElement);

        document.body.appendChild(VRButton.createButton(this.renderer));

        // Luce d'ambiente leggera
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        this.scene.add(ambientLight);

        this.raycaster = new THREE.Raycaster();
      }

      // --- CARICAMENTO CABINATO E LUCI LOCALI ---
      loadCabinato() {
        const loader = new GLTFLoader();

        loader.load(
          'Cabinato.glb',
          (gltf) => {
            this.cabinato = gltf.scene;
            this.scene.add(this.cabinato);
            this.setupCabinatoLights(this.cabinato);
          },
          undefined,
          (err) => {
            console.warn('Cabinato.glb non trovato, creo struttura di supporto integrata.');
            this.cabinato = this.createFallbackCabinato();
            this.scene.add(this.cabinato);
            this.setupCabinatoLights(this.cabinato);
          }
        );
      }

      setupCabinatoLights(cabinato) {
        // 1. TARGET DELLE LUCI
        this.targetRightFront = new THREE.Object3D();
        this.targetRightFront.position.set(0.2, 0.9, 0.0);
        cabinato.add(this.targetRightFront);

        this.targetLeftFront = new THREE.Object3D();
        this.targetLeftFront.position.set(-0.2, 0.9, 0.0);
        cabinato.add(this.targetLeftFront);

        this.targetBackground = new THREE.Object3D();
        this.targetBackground.position.set(0.0, 0.0, 0.0);
        cabinato.add(this.targetBackground);

        // 2. FARETTI SPOT
        this.spot1 = new THREE.SpotLight(0xffffff, 3.0, 5, Math.PI / 5, 0.2);
        this.spot1.position.set(-0.45, 1.9, -1.1);
        this.spot1.target = this.targetRightFront;
        cabinato.add(this.spot1);

        this.spot2 = new THREE.SpotLight(0xffffff, 3.0, 5, Math.PI / 5, 0.2);
        this.spot2.position.set(0.45, 1.9, 0.45);
        this.spot2.target = this.targetLeftFront;
        cabinato.add(this.spot2);

        this.spot3 = new THREE.SpotLight(0xffffff, 3.0, 5, Math.PI / 4, 0.2);
        this.spot3.position.set(0.0, 1.9, 0.0);
        this.spot3.target = this.targetBackground;
        cabinato.add(this.spot3);
      }

      createFallbackCabinato() {
        const group = new THREE.Group();
        const boxGeo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x222222, wireframe: true });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(0, 1.1, -0.5);
        group.add(box);
        return group;
      }

      // --- CONFIGURAZIONE VR & AGGANCIO BERETTA.GLB ---
      initXR() {
        const gltfLoader = new GLTFLoader();

        // Configurazione Controller 0 e 1
        for (let i = 0; i < 2; i++) {
          const controller = this.renderer.xr.getController(i);
          const grip = this.renderer.xr.getControllerGrip(i);
          this.scene.add(controller);
          this.scene.add(grip);

          controller.addEventListener('selectstart', () => this.onTriggerShoot(controller));

          grip.addEventListener('connected', (event) => {
            const handedness = event.data.handedness;

            // Se è il controller DESTRO, cariciamo Beretta.glb
            if (handedness === 'right') {
              this.rightGrip = grip;
              this.rightController = controller;

              gltfLoader.load(
                'Beretta.glb',
                (gltf) => {
                  this.berettaModel = gltf.scene;
                  // Aggiustamenti opzionali di offset/rotazione per farla combaciare con l'impugnatura
                  this.berettaModel.rotation.x = -Math.PI / 4;
                  this.berettaModel.position.set(0, 0, -0.05);
                  grip.add(this.berettaModel);
                },
                undefined,
                (err) => {
                  console.warn('Beretta.glb non trovata. Uso modello procedurale per la mano destra.');
                  const fallbackPistol = this.createFallbackPistol();
                  grip.add(fallbackPistol);
                }
              );
            }
          });
        }
      }

      createFallbackPistol() {
        const gunGroup = new THREE.Group();
        const barrelGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.2);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
        const barrel = new THREE.Mesh(barrelGeo, gunMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.1);

        const handleGeo = new THREE.BoxGeometry(0.03, 0.1, 0.04);
        const handle = new THREE.Mesh(handleGeo, gunMat);
        handle.position.set(0, -0.04, -0.02);
        handle.rotation.x = Math.PI / 6;

        gunGroup.add(barrel);
        gunGroup.add(handle);
        return gunGroup;
      }

      // --- BERSAGLI DI TIRO A SEGNO ---
      initTargets() {
        const colors = [0xff0055, 0x00ffcc, 0xffcc00, 0xaa00ff];

        for (let i = 0; i < 5; i++) {
          const geo = new THREE.CylinderGeometry(0.12, 0.12, 0.02, 32);
          geo.rotateX(Math.PI / 2);
          const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
          const target = new THREE.Mesh(geo, mat);

          this.resetTargetPosition(target);
          target.userData = { speed: 0.005 + Math.random() * 0.01, dir: Math.random() > 0.5 ? 1 : -1 };

          this.targets.push(target);
          this.scene.add(target);
        }
      }

      resetTargetPosition(target) {
        target.position.x = (Math.random() - 0.5) * 0.8;
        target.position.y = 0.8 + Math.random() * 0.6;
        target.position.z = -0.3 + (Math.random() - 0.5) * 0.4;
      }

      // --- LOGICA SPARO & INTERAZIONE ---
      initEvents() {
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Sparo tramite Mouse (PC/Desktop Test)
        window.addEventListener('click', () => {
          if (!this.renderer.xr.isPresenting) {
            this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
            this.executeShoot(this.raycaster);
          }
        });
      }

      onTriggerShoot(controller) {
        // Calcola il raggio lungo la direzione del controller VR (dalla Beretta)
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        this.executeShoot(this.raycaster);
      }

      executeShoot(raycaster) {
        this.playShootSound();

        const hits = raycaster.intersectObjects(this.targets);
        if (hits.length > 0) {
          const hitTarget = hits[0].object;
          this.playHitSound();
          this.score += 10;
          document.getElementById('score').innerText = this.score;

          // Effetto visivo scala ridotta all'impatto e riposizionamento
          hitTarget.scale.set(1.2, 1.2, 1.2);
          setTimeout(() => {
            hitTarget.scale.set(1, 1, 1);
            this.resetTargetPosition(hitTarget);
          }, 150);
        }
      }

      // --- LOOP DI RENDERING ---
      render() {
        // Movimento continuo dei bersagli
        this.targets.forEach((target) => {
          target.position.x += target.userData.speed * target.userData.dir;
          if (target.position.x > 0.4 || target.position.x < -0.4) {
            target.userData.dir *= -1;
          }
        });

        this.renderer.render(this.scene, this.camera);
      }
    }

    // Avvio del gioco
    new ShootingGame();
  </script>
</body>
</html>
