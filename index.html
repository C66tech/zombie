<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Zombie Arcade - GLTF Assets</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. SCENA E RENDERER WEBXR
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 2. ILLUMINAZIONE DELLA SALA
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7.5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 1.2, 10);
        pointLight.position.set(0, 2.2, -1.2);
        scene.add(pointLight);

        // Pavimento
        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 3. CARICATORE GLTF & AMBIENTE
        const loader = new GLTFLoader();

        // Caricamento Cabinato
        loader.load('cabinet.glb', (gltf) => {
            const cabinet = gltf.scene;
            cabinet.position.set(0, 0, -1.5);
            cabinet.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(cabinet);
        }, undefined, () => {
            console.warn('File "cabinet.glb" non trovato. Assicurati che sia nella stessa cartella.');
        });

        // Gestione Zombie
        const zombies = [];
        function spawnZombie(x, y, z) {
            loader.load('zombie.glb', (gltf) => {
                const zombie = gltf.scene;
                zombie.position.set(x, y, z);
                zombie.traverse((child) => {
                    if (child.isMesh) child.castShadow = true;
                });
                zombie.userData = { isZombie: true };
                scene.add(zombie);
                zombies.push(zombie);
            });
        }
        
        // Spawn del primo zombie
        spawnZombie(0, 0, -3.5);

        // 4. CONTROLLER VR & BERETTA
        const controller = renderer.xr.getController(0);
        scene.add(controller);

        loader.load('beretta.glb', (gltf) => {
            const beretta = gltf.scene;
            beretta.position.set(0, 0, -0.05);
            beretta.rotation.y = Math.PI; // Allinea la canna verso l'avanti
            beretta.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });
            controller.add(beretta);
        });

        // RAYCASTING SPARO
        const raycaster = new THREE.Raycaster();
        const tempMatrix = new THREE.Matrix4();

        controller.addEventListener('selectstart', () => {
            // Flash alla canna
            const flash = new THREE.PointLight(0xffff00, 3, 2);
            flash.position.set(0, 0.05, -0.2);
            controller.add(flash);
            setTimeout(() => controller.remove(flash), 50);

            // Calcolo traiettoria
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            // Rilevamento colpo
            const intersects = raycaster.intersectObjects(zombies, true);
            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                
                // Risali fino al root group dello zombie
                while (hitObject.parent && !zombies.includes(hitObject)) {
                    hitObject = hitObject.parent;
                }

                if (zombies.includes(hitObject)) {
                    scene.remove(hitObject);
                    zombies.splice(zombies.indexOf(hitObject), 1);
                }
            }
        });

        // 5. LOOP VR
        renderer.setAnimationLoop(() => {
            zombies.forEach(z => {
                if (z.position.z < -1.0) {
                    z.position.z += 0.003; // Avanzamento zombie
                }
            });
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
