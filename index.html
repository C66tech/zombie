<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Three.js - Spot Lights Blu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();

        // Configurazione Camera dal JSON
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.001, 1000);
        camera.position.set(0.9938, 2.4048, 4.7705);

        // Configurazione Renderer (Shadows & ToneMapping dal JSON)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.xr.enabled = true;
        
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // Target delle luci (centro dei controlli del JSON)
        const targetObject = new THREE.Object3D();
        targetObject.position.set(0.4631, 1.9743, 0.5471);
        scene.add(targetObject);

        // Funzione generazione SpotLight Blu
        const spotColor = 0x0066ff;

        function createBlueSpotLight(x, y, z, intensity, angle, penumbra) {
            const spotLight = new THREE.SpotLight(spotColor, intensity);
            spotLight.position.set(x, y, z);
            spotLight.target = targetObject;
            spotLight.angle = angle;
            spotLight.penumbra = penumbra;
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.shadow.camera.near = 0.5;
            spotLight.shadow.camera.far = 15;
            return spotLight;
        }

        // Generazione diretta delle 3 luci spot
        const spot1 = createBlueSpotLight(-2.0, 4.0, 3.0, 10, Math.PI / 6, 0.3);
        const spot2 = createBlueSpotLight(3.0, 3.5, 2.0, 8, Math.PI / 5, 0.5);
        const spot3 = createBlueSpotLight(0.0, 5.0, -2.0, 12, Math.PI / 6, 0.4);

        scene.add(spot1);
        scene.add(spot2);
        scene.add(spot3);

        // Elementi di test per la resa visiva delle ombre
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0.4631, 0, 0.5471);
        floor.receiveShadow = true;
        scene.add(floor);

        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
        );
        cube.position.set(0.4631, 1.9743, 0.5471);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Loop di Rendering WebXR
        renderer.setAnimationLoop(() => {
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
