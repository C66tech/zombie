<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tiro a Segno VR - Cabinato & Beretta</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00ffcc;
      font-family: monospace;
      font-size: 18px;
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(0, 255, 204, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    #crosshair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 2px;
      background: #ff0055;
      transform: translate(-50%, -50%);
    }

    #VRButton {
      font-family: monospace !important;
      font-weight: bold !important;
      border: 2px solid #00ffcc !important;
      background: rgba(0, 0, 0, 0.8) !important;
      color: #00ffcc !important;
      border-radius: 8px !important;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4) !important;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div>PUNTEGGIO: <span id="score-val">0</span></div>
    <div>COLPI: <span id="shots-val">0</span></div>
    <div>PRECISIONE: <span id="accuracy-val">100%</span></div>
  </div>

  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    class ShootingGame {
      constructor() {
        this.score = 0;
        this.shots = 0;
        this.hits = 0;
        this.targets = [];

        this.initAudio();
        this.initScene();
        this.initWebXR();
        this.loadCabinato();
        this.initListeners();

        this.renderer.setAnimationLoop(this.animate.bind(this));
      }

      initAudio() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playShootSound() {
        if (!this.audioCtx) return;
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.audioCtx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.12);
      }

      playHitSound() {
        if (!this.audioCtx) return;
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.15);
      }

      initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0a0a10);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        this.camera.position.set(0, 1.3, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.xr.enabled = true;

        document.getElementById('canvas-container').appendChild(this.renderer.domElement);
        document.body.appendChild(VRButton.createButton(this.renderer));

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        this.scene.add(ambientLight);

        this.raycaster = new THREE.Raycaster();
      }

      loadCabinato() {
        const loader = new GLTFLoader();
        loader.load('Cabinato.glb', (gltf) => {
          this.cabinato = gltf.scene;
          // Posizionamento del cabinato a 2 metri davanti al giocatore
          this.cabinato.position.set(0, 0, -2.0);
          this.scene.add(this.cabinato);

          this.setupCabinatoLights(this.cabinato);
          this.initTargets();
        });
      }

      setupCabinatoLights(cabinato) {
        // 1. Punti Target nello spazio locale del Cabinato
        this.targetRightFront = new THREE.Object3D();
        this.targetRightFront.position.set(0.2, 0.9, 0.0);
        cabinato.add(this.targetRightFront);

        this.targetLeftFront = new THREE.Object3D();
        this.targetLeftFront.position.set(-0.2, 0.9, 0.0);
        cabinato.add(this.targetLeftFront);

        this.targetBackground = new THREE.Object3D();
        this.targetBackground.position.set(0.0, 0.0, 0.0);
        cabinato.add(this.targetBackground);

        // 2. Faretti Spot nello spazio locale del Cabinato
        this.spot1 = new THREE.SpotLight(0xffffff, 3.5, 8, Math.PI / 4, 0.3);
        this.spot1.position.set(-0.45, 1.9, -1.1);
        this.spot1.target = this.targetRightFront;
        cabinato.add(this.spot1);

        this.spot2 = new THREE.SpotLight(0xffffff, 3.5, 8, Math.PI / 4, 0.3);
        this.spot2.position.set(0.45, 1.9, 0.45);
        this.spot2.target = this.targetLeftFront;
        cabinato.add(this.spot2);

        this.spot3 = new THREE.SpotLight(0xffffff, 3.5, 8, Math.PI / 3, 0.3);
        this.spot3.position.set(0.0, 1.9, 0.0);
        this.spot3.target = this.targetBackground;
        cabinato.add(this.spot3);
      }

      initWebXR() {
        const loader = new GLTFLoader();

        for (let i = 0; i < 2; i++) {
          const controller = this.renderer.xr.getController(i);
          const grip = this.renderer.xr.getControllerGrip(i);

          this.scene.add(controller);
          this.scene.add(grip);

          controller.addEventListener('selectstart', () => this.shootFromVR(controller));

          grip.addEventListener('connected', (event) => {
            if (event.data.handedness === 'right') {
              loader.load('Beretta.glb', (gltf) => {
                const beretta = gltf.scene;
                beretta.rotation.x = -Math.PI / 4;
                beretta.position.set(0, 0, -0.05);
                grip.add(beretta);
              });
            }
          });
        }
      }

      initTargets() {
        const colors = [0xff0055, 0x00ffcc, 0xffcc00, 0xaa00ff];

        for (let i = 0; i < 4; i++) {
          const geo = new THREE.CylinderGeometry(0.12, 0.12, 0.02, 32);
          geo.rotateX(Math.PI / 2);
          const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
          const target = new THREE.Mesh(geo, mat);

          this.resetTarget(target);
          target.userData = {
            speed: 0.004 + Math.random() * 0.006,
            dir: Math.random() > 0.5 ? 1 : -1
          };

          this.targets.push(target);
          this.cabinato.add(target);
        }
      }

      resetTarget(target) {
        target.position.x = (Math.random() - 0.5) * 0.8;
        target.position.y = 0.8 + Math.random() * 0.5;
        target.position.z = -0.2 - Math.random() * 0.3;
      }

      initListeners() {
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('pointerdown', () => {
          if (!this.renderer.xr.isPresenting) {
            this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
            this.executeShoot(this.raycaster);
          }
        });
      }

      shootFromVR(controller) {
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        this.executeShoot(this.raycaster);
      }

      executeShoot(raycaster) {
        this.shots++;
        this.playShootSound();

        const hits = raycaster.intersectObjects(this.targets, true);
        if (hits.length > 0) {
          const targetHit = hits[0].object;
          this.hits++;
          this.score += 100;

          this.playHitSound();

          targetHit.scale.set(1.2, 1.2, 1.2);
          setTimeout(() => {
            targetHit.scale.set(1, 1, 1);
            this.resetTarget(targetHit);
          }, 120);
        }

        this.updateUI();
      }

      updateUI() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('shots-val').innerText = this.shots;
        const accuracy = this.shots > 0 ? Math.round((this.hits / this.shots) * 100) : 100;
        document.getElementById('accuracy-val').innerText = `${accuracy}%`;
      }

      animate() {
        this.targets.forEach((target) => {
          target.position.x += target.userData.speed * target.userData.dir;
          if (target.position.x > 0.4 || target.position.x < -0.4) {
            target.userData.dir *= -1;
          }
        });

        this.renderer.render(this.scene, this.camera);
      }
    }

    new ShootingGame();
  </script>
</body>
</html>
