<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade 3D - Calibration SpotLights</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="ui">
    <strong>Calibrazione Faretti Cabinato</strong><br>
    ⚪ SpotLight 1: Insegna (Marquee)<br>
    🔵 SpotLight 2: Plancia Comandi<br>
    🟡 SpotLight 3: Gettoniera
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Inizializzazione Scena, Telecamera e Render ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0c);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.update();

    // --- Luce Ambientale di fondo ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // --- Funzione Creazione SpotLight e Helper ---
    function setupSpotLight(name, color, intensity, pos, targetPos, angle, penumbra) {
      const spot = new THREE.SpotLight(color, intensity);
      spot.name = name;
      spot.position.set(...pos);
      spot.angle = angle;
      spot.penumbra = penumbra;
      spot.castShadow = true;

      // Target della luce
      const targetObject = new THREE.Object3D();
      targetObject.position.set(...targetPos);
      scene.add(targetObject);
      spot.target = targetObject;

      scene.add(spot);

      // Helper visivo per la calibrazione (cono di luce)
      const helper = new THREE.SpotLightHelper(spot);
      scene.add(helper);

      return { spot, helper };
    }

    // --- 1. SpotLight Insegna Superiore (Marquee) ---
    const spot1 = setupSpotLight(
      'SpotLight1', 
      0xffffff, 
      3.0, 
      [0, 1.85, 0.25], 
      [0, 1.40, 0.40], 
      Math.PI / 4, 
      0.5
    );

    // --- 2. SpotLight Plancia Comandi & Joystick ---
    const spot2 = setupSpotLight(
      'SpotLight2', 
      0x00aaff, 
      2.0, 
      [0, 1.35, 0.10], 
      [0, 1.10, 0.45], 
      Math.PI / 6, 
      0.3
    );

    // --- 3. SpotLight Gettoniera (Coin Door) ---
    const spot3 = setupSpotLight(
      'SpotLight3', 
      0xffaa00, 
      1.5, 
      [0, 0.70, 0.20], 
      [0, 0.40, 0.35], 
      Math.PI / 5, 
      0.8
    );

    // --- Struttura Placeholder per riferimento visivo del Cabinato ---
    const cabinetGroup = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.4 });

    // Scocca principale
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.7, 0.6), mat);
    body.position.set(0, 0.85, 0);
    body.receiveShadow = true;
    cabinetGroup.add(body);

    // Schermo / Plancia
    const screen = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.4, 0.05), 
      new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 })
    );
    screen.position.set(0, 1.3, 0.25);
    screen.rotation.x = -0.2;
    cabinetGroup.add(screen);

    scene.add(cabinetGroup);

    // --- Loop di Rendering ---
    function animate() {
      requestAnimationFrame(animate);

      // Aggiornamento dinamico degli helper
      spot1.helper.update();
      spot2.helper.update();
      spot3.helper.update();

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Gestione Resize Finestra
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
