<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Meta Tag Anti-Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Versione Gioco nei Meta Dati -->
  <meta name="game-version" content="0.2.5">
  <title>WebXR 60s Zombie Arcade - v0.2.5</title>

  <!-- A-Frame v1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000000;
    }

    #version-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid rgba(0, 255, 204, 0.4);
      pointer-events: none;
    }

    #xr-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 12px;
    }

    .xr-button {
      background: #111827;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .xr-button:hover {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>

  <div id="version-overlay">
    CABINATO ZOMBIE 1960s - <span id="version-text">v0.2.5</span>
  </div>

  <div id="xr-controls">
    <button id="btn-enter-vr" class="xr-button">AVVIA VR</button>
    <button id="btn-enter-ar" class="xr-button">AVVIA AR</button>
  </div>

  <a-scene 
    embedded 
    background="transparent: true"
    webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor; optionalFeatures: hit-test, dom-overlay; overlayElement: #version-overlay"
    vr-mode-ui="enabled: false">

    <a-assets>
      <a-asset-item id="cabinato-glb" src="Cabinato.glb?v=0.2.5"></a-asset-item>
      <a-asset-item id="beretta-glb" src="Beretta.glb?v=0.2.5"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="main-camera" position="0 1.6 0" look-controls>
        <a-cursor id="gaze-cursor" raycaster="objects: .clickable" color="#00ffcc" scale="0.5 0.5 0.5"></a-cursor>
      </a-camera>

      <a-entity id="left-controller" laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>

      <a-entity id="right-controller" laser-controls="hand: right" raycaster="objects: .clickable, .target; far: 10; showLine: true" line="color: #ff0000; opacity: 0.85">
        <a-entity id="gun-alignment-pivot" position="0 0 0" rotation="0 0 0">
          <a-entity id="beretta-model" 
                    gltf-model="#beretta-glb" 
                    position="0 -0.03 -0.05" 
                    rotation="-10 0 0" 
                    scale="1 1 1">
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- 3D HUD DI DEBUG & CALIBRAZIONE IMPUGNATURA 6-DOF (Sinistra) -->
    <a-entity id="hud-debug-panel" position="-1.45 1.35 -1.1" rotation="0 35 0">
      <a-plane width="1.4" height="1.95" color="#0f172a" material="opacity: 0.93; transparent: true; shader: flat"></a-plane>
      
      <a-text value="CALIBRAZIONE 6-DOF BERETTA" position="-0.63 0.85 0.01" scale="0.32 0.32 0.32" color="#38bdf8" font="monoid"></a-text>
      <a-text value="VER: v0.2.5" position="-0.63 0.77 0.01" scale="0.22 0.22 0.22" color="#94a3b8"></a-text>

      <!-- Lettura Valori In Tempo Reale (Per Default) -->
      <a-text id="hud-pos-readout" value="POS: X:0.000 Y:-0.030 Z:-0.050" position="-0.63 0.64 0.01" scale="0.23 0.23 0.23" color="#00ffcc"></a-text>
      <a-text id="hud-rot-readout" value="ROT: P:-10° Y:0° R:0°" position="-0.63 0.56 0.01" scale="0.23 0.23 0.23" color="#00ffcc"></a-text>

      <!-- SEZIONE 1: TRASLAZIONE (X, Y, Z) -->
      <a-text value="TRASLAZIONE (PASSO 0.5cm):" position="-0.63 0.44 0.01" scale="0.2 0.2 0.2" color="#f59e0b"></a-text>
      
      <!-- Asse X -->
      <a-text value="ASSE X:" position="-0.63 0.34 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-px-plus" class="clickable" position="-0.24 0.34 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="X +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-px-minus" class="clickable" position="0.06 0.34 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="X -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- Asse Y (Altezza) -->
      <a-text value="ASSE Y:" position="-0.63 0.22 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-py-plus" class="clickable" position="-0.24 0.22 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="Y +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-py-minus" class="clickable" position="0.06 0.22 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="Y -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- Asse Z (Profondità) -->
      <a-text value="ASSE Z:" position="-0.63 0.10 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-pz-plus" class="clickable" position="-0.24 0.10 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="Z +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-pz-minus" class="clickable" position="0.06 0.10 0.03" width="0.24" height="0.09" depth="0.02" color="#2563eb"><a-text value="Z -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- SEZIONE 2: ROTAZIONE (PITCH, YAW, ROLL) -->
      <a-text value="ROTAZIONE (PASSO 1°):" position="-0.63 -0.04 0.01" scale="0.2 0.2 0.2" color="#f59e0b"></a-text>
      
      <!-- Pitch -->
      <a-text value="PITCH:" position="-0.63 -0.14 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-rx-plus" class="clickable" position="-0.24 -0.14 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="P +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-rx-minus" class="clickable" position="0.06 -0.14 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="P -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- Yaw (Aggiunto) -->
      <a-text value="YAW:" position="-0.63 -0.26 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-ry-plus" class="clickable" position="-0.24 -0.26 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="Y +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-ry-minus" class="clickable" position="0.06 -0.26 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="Y -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- Roll -->
      <a-text value="ROLL:" position="-0.63 -0.38 0.01" scale="0.2 0.2 0.2" color="#ffffff"></a-text>
      <a-box id="btn-rz-plus" class="clickable" position="-0.24 -0.38 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="R +" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>
      <a-box id="btn-rz-minus" class="clickable" position="0.06 -0.38 0.03" width="0.24" height="0.09" depth="0.02" color="#d97706"><a-text value="R -" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#fff"></a-text></a-box>

      <!-- Pulsanti Reset e Griglia -->
      <a-box id="btn-grip-reset" class="clickable" position="-0.30 -0.56 0.03" width="0.55" height="0.11" depth="0.02" color="#475569">
        <a-text value="RESET OFFSET" align="center" position="0 0 0.02" scale="0.17 0.17 0.17" color="#ffffff"></a-text>
      </a-box>

      <a-box id="btn-hud-toggle" class="clickable" position="0.30 -0.56 0.03" width="0.55" height="0.11" depth="0.02" color="#0d9488">
        <a-text value="GRID ON/OFF" align="center" position="0 0 0.02" scale="0.17 0.17 0.17" color="#ffffff"></a-text>
      </a-box>

      <!-- Telemetria Stato -->
      <a-text id="hud-telemetry" value="Sessione: Standby | Modo: Desktop 2D" position="-0.63 -0.76 0.01" scale="0.18 0.18 0.18" color="#94a3b8"></a-text>
    </a-entity>

    <!-- ZONA DI GIOCO CENTRALE -->
    <a-entity id="gameplay-zone" position="0 0 -1.8">
      <a-grid id="floor-grid" position="0 0 1.8" width="8" height="8" color-center="#38bdf8" color-grid="#1e293b"></a-grid>
      
      <a-entity id="arcade-cabinet" 
                gltf-model="#cabinato-glb" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="1 1 1"
                class="target">
      </a-entity>
    </a-entity>

    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" position="2 4 2" intensity="0.6"></a-light>
    <a-light type="point" position="0 1.5 -1" color="#ff4444" intensity="0.5"></a-light>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const GAME_VERSION = "0.2.5";
      const sceneEl = document.querySelector("a-scene");
      const btnVR = document.getElementById("btn-enter-vr");
      const btnAR = document.getElementById("btn-enter-ar");
      const hudTelemetry = document.getElementById("hud-telemetry");
      const floorGrid = document.getElementById("floor-grid");
      const btnHudToggle = document.getElementById("btn-hud-toggle");
      const gazeCursor = document.getElementById("gaze-cursor");

      const berettaModel = document.getElementById("beretta-model");
      const hudPosReadout = document.getElementById("hud-pos-readout");
      const hudRotReadout = document.getElementById("hud-rot-readout");

      // Modifica qui i valori predefiniti una volta annotati
      const gunOffset = {
        x: 0.0,
        y: -0.03,
        z: -0.05,
        rx: -10,
        ry: 0,
        rz: 0
      };

      function updateGunTransform() {
        berettaModel.setAttribute("position", `${gunOffset.x.toFixed(3)} ${gunOffset.y.toFixed(3)} ${gunOffset.z.toFixed(3)}`);
        berettaModel.setAttribute("rotation", `${gunOffset.rx.toFixed(1)} ${gunOffset.ry.toFixed(1)} ${gunOffset.rz.toFixed(1)}`);

        hudPosReadout.setAttribute("value", `POS: X:${gunOffset.x.toFixed(3)} Y:${gunOffset.y.toFixed(3)} Z:${gunOffset.z.toFixed(3)}`);
        hudRotReadout.setAttribute("value", `ROT: P:${gunOffset.rx.toFixed(0)}° Y:${gunOffset.ry.toFixed(0)}° R:${gunOffset.rz.toFixed(0)}°`);

        // Stampa anche in console per comodo copia-incolla
        console.log(`DEFAULT: position="${gunOffset.x.toFixed(3)} ${gunOffset.y.toFixed(3)} ${gunOffset.z.toFixed(3)}" rotation="${gunOffset.rx.toFixed(1)} ${gunOffset.ry.toFixed(1)} ${gunOffset.rz.toFixed(1)}"`);
      }

      // Event Listeners Traslazione (Passo 0.005m / 0.5cm)
      document.getElementById("btn-px-plus").addEventListener("click", () => { gunOffset.x += 0.005; updateGunTransform(); });
      document.getElementById("btn-px-minus").addEventListener("click", () => { gunOffset.x -= 0.005; updateGunTransform(); });
      document.getElementById("btn-py-plus").addEventListener("click", () => { gunOffset.y += 0.005; updateGunTransform(); });
      document.getElementById("btn-py-minus").addEventListener("click", () => { gunOffset.y -= 0.005; updateGunTransform(); });
      document.getElementById("btn-pz-plus").addEventListener("click", () => { gunOffset.z += 0.005; updateGunTransform(); });
      document.getElementById("btn-pz-minus").addEventListener("click", () => { gunOffset.z -= 0.005; updateGunTransform(); });

      // Event Listeners Rotazione (Pitch, Yaw, Roll)
      document.getElementById("btn-rx-plus").addEventListener("click", () => { gunOffset.rx += 1; updateGunTransform(); });
      document.getElementById("btn-rx-minus").addEventListener("click", () => { gunOffset.rx -= 1; updateGunTransform(); });
      document.getElementById("btn-ry-plus").addEventListener("click", () => { gunOffset.ry += 1; updateGunTransform(); });
      document.getElementById("btn-ry-minus").addEventListener("click", () => { gunOffset.ry -= 1; updateGunTransform(); });
      document.getElementById("btn-rz-plus").addEventListener("click", () => { gunOffset.rz += 1; updateGunTransform(); });
      document.getElementById("btn-rz-minus").addEventListener("click", () => { gunOffset.rz -= 1; updateGunTransform(); });

      // Reset
      document.getElementById("btn-grip-reset").addEventListener("click", () => {
        gunOffset.x = 0.0;
        gunOffset.y = -0.03;
        gunOffset.z = -0.05;
        gunOffset.rx = -10;
        gunOffset.ry = 0;
        gunOffset.rz = 0;
        updateGunTransform();
      });

      // Gestione Sessione WebXR
      btnVR.addEventListener("click", () => sceneEl.enterVR());

      btnAR.addEventListener("click", () => {
        if (typeof sceneEl.enterAR === "function") {
          sceneEl.enterAR();
        } else {
          sceneEl.setAttribute("webxr", "optionalFeatures: hit-test, dom-overlay, local-floor");
          sceneEl.enterVR();
        }
      });

      sceneEl.addEventListener("enter-vr", () => {
        const isAR = sceneEl.is("ar-mode");
        const modeText = isAR ? "AR Passthrough" : "VR Immersiva";
        hudTelemetry.setAttribute("value", `Sessione: Attiva | ${modeText}`);
        if (gazeCursor) gazeCursor.setAttribute("visible", "false");
        if (isAR) floorGrid.setAttribute("visible", "false");
      });

      sceneEl.addEventListener("exit-vr", () => {
        hudTelemetry.setAttribute("value", "Sessione: Inattiva | Modo: Desktop 2D");
        floorGrid.setAttribute("visible", "true");
        if (gazeCursor) gazeCursor.setAttribute("visible", "true");
      });

      btnHudToggle.addEventListener("click", () => {
        const isVisible = floorGrid.getAttribute("visible") !== "false";
        floorGrid.setAttribute("visible", (!isVisible).toString());
      });
    });
  </script>
</body>
</html>
