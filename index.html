<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="game-version" content="1.2.0">
  <title>Tiro a Segno VR/AR - v1.2.0</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffcc;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .version-badge {
      font-size: 14px;
      color: #8888aa;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .score-badge {
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    #xr-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .xr-btn {
      background: linear-gradient(135deg, #00ffcc 0%, #0088cc 100%);
      border: none;
      color: #000;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      transition: all 0.2s ease;
    }

    .xr-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
    }

    .xr-btn:disabled {
      background: #333344;
      color: #666677;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- UI OVERLAY -->
  <div id="ui-container">
    <div class="version-badge" id="game-version">VER. 1.2.0</div>
    <div class="score-badge">PUNTI: <span id="score">0</span></div>
  </div>

  <!-- PULSANTI XR -->
  <div id="xr-controls">
    <button id="vr-btn" class="xr-btn">AVVIA VR</button>
    <button id="ar-btn" class="xr-btn">AVVIA AR</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const GAME_VERSION = "1.2.0";

    class ShootingGame {
      constructor() {
        this.version = GAME_VERSION;
        this.score = 0;
        this.targets = [];
        this.berettaModel = null;
        this.spots = []; // Riferimento alle luci per lo sfarfallio

        this.initAudio();
        this.initScene();
        this.initXR();
        this.loadCabinato();
        this.initTargets();
        this.initEvents();

        this.renderer.setAnimationLoop(this.render.bind(this));
      }

      // --- SINTETIZZATORE AUDIO ---
      initAudio() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playShootSound() {
        if (!this.audioCtx) return;
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.15);
      }

      playHitSound() {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.1);
      }

      // --- INIZIALIZZAZIONE SCENA THREE.JS ---
      initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x050508);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        this.camera.position.set(0, 1.2, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.pixelRatio = window.devicePixelRatio;
        this.renderer.xr.enabled = true;
        document.body.appendChild(this.renderer.domElement);

        // Luce ambiente molto fioca con tinta calda
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.15);
        this.scene.add(ambientLight);

        this.raycaster = new THREE.Raycaster();
      }

      // --- CONFIGURAZIONE RAGGIO LASER PARALLELO ---
      createLaserBeam() {
        const laserGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -15) // Raggio parallelo proiettato in avanti
        ]);
        const laserMat = new THREE.LineBasicMaterial({
          color: 0xff0033,
          transparent: true,
          opacity: 0.7,
          linewidth: 2
        });
        const laser = new THREE.Line(laserGeo, laserMat);
        laser.position.set(0, 0.02, 0); // Leggero offset sulla canna
        return laser;
      }

      // --- GESTIONE SESSIONI VR & AR ---
      initXR() {
        const vrBtn = document.getElementById('vr-btn');
        const arBtn = document.getElementById('ar-btn');

        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
            vrBtn.disabled = !supported;
          });
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            arBtn.disabled = !supported;
          });

          vrBtn.addEventListener('click', () => this.startXRSession('immersive-vr'));
          arBtn.addEventListener('click', () => this.startXRSession('immersive-ar'));
        } else {
          vrBtn.disabled = true;
          arBtn.disabled = true;
        }

        const gltfLoader = new GLTFLoader();
        for (let i = 0; i < 2; i++) {
          const controller = this.renderer.xr.getController(i);
          const grip = this.renderer.xr.getControllerGrip(i);
          this.scene.add(controller);
          this.scene.add(grip);

          controller.addEventListener('selectstart', () => this.onTriggerShoot(controller));

          grip.addEventListener('connected', (event) => {
            if (event.data.handedness === 'right') {
              gltfLoader.load('Beretta.glb', (gltf) => {
                this.berettaModel = gltf.scene;
                this.berettaModel.rotation.x = -Math.PI / 4;
                this.berettaModel.position.set(0, 0, -0.05);

                // Aggiungiamo il raggio laser agganciato direttamente alla Beretta
                const laser = this.createLaserBeam();
                this.berettaModel.add(laser);

                grip.add(this.berettaModel);
              });
            }
          });
        }
      }

      async startXRSession(mode) {
        try {
          const session = await navigator.xr.requestSession(mode, {
            optionalFeatures: ['local-floor', 'bounded-floor']
          });
          
          if (mode === 'immersive-ar') {
            this.scene.background = null;
          }

          session.addEventListener('end', () => {
            this.scene.background = new THREE.Color(0x050508);
          });

          this.renderer.xr.setSession(session);
        } catch (e) {
          console.error('Errore nell\'avvio della sessione ' + mode, e);
        }
      }

      // --- CARICAMENTO CABINATO & LUCI BIANCO CALDO ---
      loadCabinato() {
        const loader = new GLTFLoader();
        loader.load('Cabinato.glb', (gltf) => {
          this.cabinato = gltf.scene;
          this.cabinato.position.set(0, 0, -2.0);
          this.scene.add(this.cabinato);

          this.setupCabinatoLights(this.cabinato);
          this.attachTargetsToCabinato();
        });
      }

      setupCabinatoLights(cabinato) {
        // Target interni
        this.targetRightFront = new THREE.Object3D();
        this.targetRightFront.position.set(0.2, 0.9, 0.0);
        cabinato.add(this.targetRightFront);

        this.targetLeftFront = new THREE.Object3D();
        this.targetLeftFront.position.set(-0.2, 0.9, 0.0);
        cabinato.add(this.targetLeftFront);

        this.targetBackground = new THREE.Object3D();
        this.targetBackground.position.set(0.0, 0.0, 0.0);
        cabinato.add(this.targetBackground);

        // Faretti Spot con colore Bianco Caldo (0xffe4ce)
        const warmColor = 0xffe4ce;
        const baseIntensity = 3.0;

        this.spot1 = new THREE.SpotLight(warmColor, baseIntensity, 5, Math.PI / 5, 0.2);
        this.spot1.position.set(-0.45, 1.9, -1.1);
        this.spot1.target = this.targetRightFront;
        cabinato.add(this.spot1);

        this.spot2 = new THREE.SpotLight(warmColor, baseIntensity, 5, Math.PI / 5, 0.2);
        this.spot2.position.set(0.45, 1.9, 0.45);
        this.spot2.target = this.targetLeftFront;
        cabinato.add(this.spot2);

        this.spot3 = new THREE.SpotLight(warmColor, baseIntensity, 5, Math.PI / 4, 0.2);
        this.spot3.position.set(0.0, 1.9, 0.0);
        this.spot3.target = this.targetBackground;
        cabinato.add(this.spot3);

        // Salviamo i faretti per gestirne lo sfarfallio
        this.spots = [
          { light: this.spot1, base: baseIntensity },
          { light: this.spot2, base: baseIntensity },
          { light: this.spot3, base: baseIntensity }
        ];
      }

      // --- BERSAGLI MOBILI ---
      initTargets() {
        const colors = [0xff0055, 0x00ffcc, 0xffcc00, 0xaa00ff];

        for (let i = 0; i < 5; i++) {
          const geo = new THREE.CylinderGeometry(0.12, 0.12, 0.02, 32);
          geo.rotateX(Math.PI / 2);
          const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
          const target = new THREE.Mesh(geo, mat);

          target.userData = { speed: 0.005 + Math.random() * 0.008, dir: Math.random() > 0.5 ? 1 : -1 };
          this.targets.push(target);
        }
      }

      attachTargetsToCabinato() {
        this.targets.forEach((target) => {
          this.resetTargetPosition(target);
          this.cabinato.add(target);
        });
      }

      resetTargetPosition(target) {
        target.position.x = (Math.random() - 0.5) * 0.8;
        target.position.y = 0.8 + Math.random() * 0.6;
        target.position.z = -0.3 + (Math.random() - 0.5) * 0.4;
      }

      // --- LOGICA SPARO ---
      initEvents() {
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('click', () => {
          if (!this.renderer.xr.isPresenting) {
            this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
            this.executeShoot(this.raycaster);
          }
        });
      }

      onTriggerShoot(controller) {
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        this.executeShoot(this.raycaster);
      }

      executeShoot(raycaster) {
        this.playShootSound();

        const hits = raycaster.intersectObjects(this.targets);
        if (hits.length > 0) {
          const hitTarget = hits[0].object;
          this.playHitSound();
          this.score += 10;
          document.getElementById('score').innerText = this.score;

          hitTarget.scale.set(1.2, 1.2, 1.2);
          setTimeout(() => {
            hitTarget.scale.set(1, 1, 1);
            this.resetTargetPosition(hitTarget);
          }, 150);
        }
      }

      // --- LOOP DI RENDERING ---
      render() {
        // Movimento bersagli
        if (this.cabinato) {
          this.targets.forEach((target) => {
            target.position.x += target.userData.speed * target.userData.dir;
            if (target.position.x > 0.4 || target.position.x < -0.4) {
              target.userData.dir *= -1;
            }
          });
        }

        // Effetto Sfarfallio (Flicker) delle luci calde
        this.spots.forEach(item => {
          if (Math.random() > 0.92) {
            item.light.intensity = item.base * (0.4 + Math.random() * 0.8);
          } else {
            item.light.intensity = item.base;
          }
        });

        this.renderer.render(this.scene, this.camera);
      }
    }

    new ShootingGame();
  </script>
</body>
</html>
