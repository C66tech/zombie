<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Meta Tag Anti-Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Versione Gioco nei Meta Dati -->
  <meta name="game-version" content="0.2.10">
  <title>WebXR 60s Zombie Arcade - v0.2.10</title>

  <!-- A-Frame v1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000000;
    }

    #version-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid rgba(0, 255, 204, 0.4);
      pointer-events: none;
    }

    #xr-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 12px;
    }

    .xr-button {
      background: #111827;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .xr-button:hover {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>

  <div id="version-overlay">
    CABINATO ZOMBIE 1960s - <span id="version-text">v0.2.10</span>
  </div>

  <div id="xr-controls">
    <button id="btn-enter-vr" class="xr-button">AVVIA VR</button>
    <button id="btn-enter-ar" class="xr-button">AVVIA AR</button>
  </div>

  <a-scene 
    embedded 
    background="transparent: true"
    webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor; optionalFeatures: hit-test, dom-overlay; overlayElement: #version-overlay"
    vr-mode-ui="enabled: false">

    <a-assets>
      <a-asset-item id="cabinato-glb" src="Cabinato.glb?v=0.2.10"></a-asset-item>
      <a-asset-item id="beretta-glb" src="Beretta.glb?v=0.2.10"></a-asset-item>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="main-camera" position="0 1.6 0" look-controls>
        <a-cursor id="gaze-cursor" raycaster="objects: .clickable" color="#00ffcc" scale="0.5 0.5 0.5"></a-cursor>
      </a-camera>

      <!-- Controller Sinistro (Interazione HUD) -->
      <a-entity id="left-controller" laser-controls="hand: left; model: true" raycaster="objects: .clickable; far: 5"></a-entity>

      <!-- Controller Destro -->
      <a-entity id="right-controller" laser-controls="hand: right; model: false">
        <a-entity id="beretta-model" 
                  gltf-model="#beretta-glb" 
                  position="0 -0.03 -0.05" 
                  rotation="-75 -10 2" 
                  scale="1 1 1">
          <a-entity id="gun-laser" 
                    raycaster="objects: .clickable, .target; far: 10; showLine: true; origin: 0 0 0; direction: 0 0 -1" 
                    line="color: #ff0000; opacity: 0.85">
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- 3D HUD PANNELLO INFO E CONTROLLO LUCI (Sinistra) -->
    <a-entity id="hud-debug-panel" position="-1.4 1.35 -1.1" rotation="0 35 0">
      <a-plane width="1.2" height="1.3" color="#0f172a" material="opacity: 0.92; transparent: true; shader: flat"></a-plane>
      
      <a-text value="CONTROLLO LUCI CABINATO" position="-0.52 0.5 0.01" scale="0.3 0.3 0.3" color="#38bdf8" font="monoid"></a-text>
      <a-text value="VER: v0.2.10" position="-0.52 0.42 0.01" scale="0.22 0.22 0.22" color="#94a3b8"></a-text>

      <!-- Stato Luci -->
      <a-text id="hud-light-status" value="Colore: #ff0000 | Intensità: 1.0" position="-0.52 0.3 0.01" scale="0.2 0.2 0.2" color="#00ffcc"></a-text>

      <!-- Tasti Cambio Colore e Intensità dall'HUD -->
      <a-box id="btn-change-color" class="clickable" position="0 0.1 0.03" width="0.9" height="0.12" depth="0.02" color="#7c3aed">
        <a-text value="CAMBIA COLORE LUCE" align="center" position="0 0 0.02" scale="0.18 0.18 0.18" color="#ffffff"></a-text>
      </a-box>

      <a-box id="btn-toggle-intensity" class="clickable" position="0 -0.06 0.03" width="0.9" height="0.12" depth="0.02" color="#2563eb">
        <a-text value="CAMBIA INTENSITÀ (1x / 2.5x)" align="center" position="0 0 0.02" scale="0.17 0.17 0.17" color="#ffffff"></a-text>
      </a-box>

      <a-box id="btn-hud-toggle" class="clickable" position="0 -0.22 0.03" width="0.9" height="0.12" depth="0.02" color="#0d9488">
        <a-text value="TOGGLE GRIGLIA PAVIMENTO" align="center" position="0 0 0.02" scale="0.17 0.17 0.17" color="#ffffff"></a-text>
      </a-box>

      <a-text id="hud-telemetry" value="Sessione: Standby | Modo: Desktop 2D" position="-0.52 -0.45 0.01" scale="0.18 0.18 0.18" color="#94a3b8"></a-text>
    </a-entity>

    <!-- ZONA DI GIOCO CENTRALE -->
    <a-entity id="gameplay-zone" position="0 0 -1.8">
      <a-grid id="floor-grid" position="0 0 1.8" width="8" height="8" color-center="#38bdf8" color-grid="#1e293b"></a-grid>
      
      <!-- CABINATO ARCADE (Modello GLB) -->
      <a-entity id="arcade-cabinet" 
                gltf-model="#cabinato-glb" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="1 1 1"
                class="target">
        
        <!-- Luce Ambientale/Atmosfera interna al cabinato (Sincronizzata via JS) -->
        <a-light id="cabinet-internal-light" 
                 type="point" 
                 color="#ff0000" 
                 intensity="1.0" 
                 distance="3" 
                 position="0 1.2 0">
        </a-light>
      </a-entity>
    </a-entity>

    <!-- Luci Generali Scena -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" position="2 4 2" intensity="0.5"></a-light>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const GAME_VERSION = "0.2.10";
      const sceneEl = document.querySelector("a-scene");
      const btnVR = document.getElementById("btn-enter-vr");
      const btnAR = document.getElementById("btn-enter-ar");
      const hudTelemetry = document.getElementById("hud-telemetry");
      const floorGrid = document.getElementById("floor-grid");
      const btnHudToggle = document.getElementById("btn-hud-toggle");
      const gazeCursor = document.getElementById("gaze-cursor");

      const arcadeCabinet = document.getElementById("arcade-cabinet");
      const cabinetLight = document.getElementById("cabinet-internal-light");
      const hudLightStatus = document.getElementById("hud-light-status");
      const btnChangeColor = document.getElementById("btn-change-color");
      const btnToggleIntensity = document.getElementById("btn-toggle-intensity");

      // Palette Colori Vintage Arcade per il Cambio Dinamico
      const lightColors = ["#ff0000", "#00ffcc", "#f59e0b", "#a855f7", "#10b981"];
      let colorIndex = 0;
      let currentIntensity = 1.0;
      let internalGltfLights = []; // Riferimento alle eventuali luci native trovate dentro Cabinato.glb

      // 1. Ispezione del modello GLB all'avvio per rilevare luci create in Blender
      arcadeCabinet.addEventListener("model-loaded", () => {
        const mesh = arcadeCabinet.getObject3D("mesh");
        if (!mesh) return;

        mesh.traverse((node) => {
          if (node.isLight) {
            console.log("Trovata luce nativa nel file GLB del Cabinato:", node.name || "Luce Senza Nome");
            internalGltfLights.push(node);
          }
        });
      });

      // 2. Funzione per aggiornare il colore sia della luce A-Frame che di quelle nel GLB
      function setCabinetLightColor(hexColor) {
        // Aggiorna luce A-Frame
        cabinetLight.setAttribute("light", "color", hexColor);

        // Aggiorna eventuali luci native trovate nel file GLB Three.js
        internalGltfLights.forEach(light => {
          light.color.set(hexColor);
        });

        updateLightHUDInfo();
      }

      // 3. Funzione per aggiornare l'intensità
      function setCabinetLightIntensity(val) {
        currentIntensity = val;
        cabinetLight.setAttribute("light", "intensity", val);

        internalGltfLights.forEach(light => {
          light.intensity = val;
        });

        updateLightHUDInfo();
      }

      function updateLightHUDInfo() {
        const currentColor = lightColors[colorIndex];
        hudLightStatus.setAttribute("value", `Colore: ${currentColor} | Intensita: ${currentIntensity.toFixed(1)}`);
      }

      // Handlers Pulsanti HUD
      btnChangeColor.addEventListener("click", () => {
        colorIndex = (colorIndex + 1) % lightColors.length;
        setCabinetLightColor(lightColors[colorIndex]);
      });

      btnToggleIntensity.addEventListener("click", () => {
        const nextIntensity = currentIntensity === 1.0 ? 2.5 : 1.0;
        setCabinetLightIntensity(nextIntensity);
      });

      // Gestione VR/AR
      btnVR.addEventListener("click", () => sceneEl.enterVR());

      btnAR.addEventListener("click", () => {
        if (typeof sceneEl.enterAR === "function") {
          sceneEl.enterAR();
        } else {
          sceneEl.setAttribute("webxr", "optionalFeatures: hit-test, dom-overlay, local-floor");
          sceneEl.enterVR();
        }
      });

      sceneEl.addEventListener("enter-vr", () => {
        const isAR = sceneEl.is("ar-mode");
        const modeText = isAR ? "AR Passthrough" : "VR Immersiva";
        hudTelemetry.setAttribute("value", `Sessione: Attiva | ${modeText}`);
        if (gazeCursor) gazeCursor.setAttribute("visible", "false");
        if (isAR) floorGrid.setAttribute("visible", "false");
      });

      sceneEl.addEventListener("exit-vr", () => {
        hudTelemetry.setAttribute("value", "Sessione: Inattiva | Modo: Desktop 2D");
        floorGrid.setAttribute("visible", "true");
        if (gazeCursor) gazeCursor.setAttribute("visible", "true");
      });

      btnHudToggle.addEventListener("click", () => {
        const isVisible = floorGrid.getAttribute("visible") !== "false";
        floorGrid.setAttribute("visible", (!isVisible).toString());
      });
    });
  </script>
</body>
</html>
